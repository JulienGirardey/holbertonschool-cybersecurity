nft add table inet filter
nft add chain input {
    type filter hook input priority 0 ; policy drop ;

    ct state established,related accept
    ip protocol icmp accept
    tcp dport 22 accept
    udp dport 51820 accept
    iif lo accept
}
nft add chain forward {
    type filter hook forward priority 0\; policy drop \;

    iif wg0 accept
}
nft add chain output '{ type filter hook output priority 0\; policy accept \; }'

nft add table ip nat
nft add chain postrouting {
    type nat hook postrouting priority 100 ; masquerade ;
    ip saddr 10.200.0.2
    saddr 10.200.0.2 tcp dport 22 accept
}
